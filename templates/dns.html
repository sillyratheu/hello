<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Settings - {{ domain }} | Hello Corporation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-gray-200 py-4 px-6 md:px-12 flex justify-between items-center bg-white">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-black text-white rounded-md flex items-center justify-center font-bold text-sm">H</div>
            <span class="text-sm font-bold tracking-tight">Hello Corporation <span class="text-gray-400 font-normal">/ DNS Manager</span></span>
        </div>
        <a href="/" class="text-xs font-semibold text-blue-600 hover:underline">&larr; Back to Dashboard</a>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto w-full px-6 py-10 flex-1">
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-200">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">{{ domain }}</h1>
                <p class="text-xs text-emerald-600 font-medium mt-1">● Status: Active & Global DNS Live</p>
            </div>
            <span class="text-xs bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md font-semibold text-gray-700">Advanced DNS</span>
        </div>

        <!-- DNS Form -->
        <form method="POST" class="space-y-5 bg-gray-50 border border-gray-200 p-6 rounded-2xl shadow-sm">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1.5">A Record (IPv4 Address)</label>
                <input type="text" name="ip" value="{{ info.ip }}" required class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-xs text-blue-600 font-mono focus:outline-none focus:border-black">
                <p class="text-[11px] text-gray-500 mt-1">Points your domain name to your hosting server IP.</p>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1.5">CNAME Record (Alias)</label>
                <input type="text" name="cname" value="{{ info.cname }}" required class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-xs text-gray-800 font-mono focus:outline-none focus:border-black">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1.5">TXT Record (Verification)</label>
                <input type="text" name="txt" value="{{ info.txt }}" required class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-xs text-gray-800 font-mono focus:outline-none focus:border-black">
            </div>

            <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 rounded-lg transition text-sm shadow-sm mt-2">
                Save DNS Records
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 py-6 text-center text-xs text-gray-500 bg-white">
        Hello Corporation Infrastructure. Administered by <span class="text-gray-900 font-medium">Ramim</span>.
    </footer>

</body>
</html>
