<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Management - {{ domain }} | Hello Corporation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen p-6 flex flex-col justify-between">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center py-4 border-b border-gray-800">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white">H</div>
            <span class="text-sm font-bold tracking-tight">Hello Corporation <span class="text-gray-500 font-normal">| DNS Manager</span></span>
        </div>
        <a href="/" class="text-xs text-indigo-400 hover:underline">&larr; Back to Dashboard</a>
    </header>

    <!-- Main Content -->
    <main class="max-w-2xl mx-auto w-full my-6 bg-[#111827] p-8 rounded-2xl border border-gray-800 shadow-2xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-800">
            <div>
                <h1 class="text-xl font-bold text-white">{{ domain }}</h1>
                <p class="text-xs text-green-400 mt-0.5">● Status: Active & Global Routing Live</p>
            </div>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2.5 py-1 rounded-md font-medium">DNS Control Panel</span>
        </div>

        <!-- DNS Records Update Form -->
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1.5">A Record (IPv4 Address)</label>
                <input type="text" name="ip" value="{{ info.ip }}" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-lg px-4 py-2.5 text-xs text-indigo-300 font-mono focus:outline-none focus:border-indigo-500">
                <p class="text-[10px] text-gray-500 mt-1">Points your domain to your specific server or hosting node IP.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1.5">CNAME Record (Alias)</label>
                <input type="text" name="cname" value="{{ info.cname }}" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-lg px-4 py-2.5 text-xs text-gray-300 font-mono focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-gray-400 mb-1.5">TXT Record (Verification)</label>
                <input type="text" name="txt" value="{{ info.txt }}" required class="w-full bg-[#0b0f19] border border-gray-700 rounded-lg px-4 py-2.5 text-xs text-gray-300 font-mono focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition shadow-lg shadow-indigo-600/20 text-sm mt-2">Save DNS Changes</button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-gray-500 border-t border-gray-800/60 pt-4">
        Hello Corporation Infrastructure. Administered by <span class="text-gray-400 font-medium">Ramim the owner of Shahajjo</span>.
    </footer>

</body>
</html>
